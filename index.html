<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2a78d6" />
<title>Angle Lab — face &amp; photo dashboard</title>
<meta name="description" content="A private, on-device dashboard for understanding your facial proportions and finding your best camera angles and lighting." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Angle Lab</span>
  </div>
  <p class="brand-tag">All on your phone. Nothing uploaded.</p>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="dashboard" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="tab" data-tab="scan">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 2 7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.2L15 2H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    <span>New Scan</span>
  </button>
  <button class="tab" data-tab="tips">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 21h6v-1H9v1Zm3-19a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2Z"/></svg>
    <span>Tips</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
