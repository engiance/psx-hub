<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSX Hub — Card Empire</title>
<meta name="description" content="Sports card business command center: deal hunting, inventory, listings, and profit tracking." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="assets/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">💎</div>
      <div class="brand-text">
        <strong>PSX&nbsp;Hub</strong>
        <span>Card Empire</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span class="ni">📊</span> Dashboard</button>
      <button class="nav-item" data-view="deals"><span class="ni">🔥</span> Deal Hunter <em class="badge" id="badge-deals"></em></button>
      <button class="nav-item" data-view="inventory"><span class="ni">📦</span> Inventory <em class="badge" id="badge-inventory"></em></button>
      <button class="nav-item" data-view="listings"><span class="ni">🏷️</span> Listings <em class="badge" id="badge-listings"></em></button>
      <button class="nav-item" data-view="sales"><span class="ni">💰</span> Sales <em class="badge" id="badge-sales"></em></button>
      <button class="nav-item" data-view="settings"><span class="ni">⚙️</span> Settings</button>
    </nav>
    <div class="sidebar-foot">
      <div class="networth">
        <span>Empire Net Worth</span>
        <strong id="side-networth">$0</strong>
      </div>
      <div class="autosave" id="autosave">Saved locally</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub" class="muted"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- Modal host -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modal-title">Title</h2>
      <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-host" id="toast-host"></div>

<script src="assets/app.js"></script>
</body>
</html>
